name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on GitHub's Ubuntu runners;
      # settings are read from .shellcheckrc
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -x zfsync zfsync.conf lib/*
